name: Build Modem Zaid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Subset Offline Cairo Fonts & Prepare Android Platform
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" -o /tmp/Cairo-VF.ttf
          python3 -m pip install --quiet fonttools brotli pillow

          python3 - << 'PYEOF'
          from fontTools.ttLib import TTFont
          from fontTools.varLib.instancer import instantiateVariableFont
          from fontTools.subset import main as subset_main
          import os

          unicodes = "U+0020-007E,U+00A0-00FF,U+0600-06FF,U+0750-077F,U+08A0-08FF,U+2000-206F,U+2190-21FF,U+FB50-FDFF,U+FE70-FEFF"
          for w, name in [(400, "Cairo-Regular.ttf"), (600, "Cairo-SemiBold.ttf"), (700, "Cairo-Bold.ttf")]:
              vf = TTFont("/tmp/Cairo-VF.ttf")
              inst = instantiateVariableFont(vf, {"wght": w, "slnt": 0})
              raw_path = f"/tmp/raw_{name}"
              out_path = f"assets/fonts/{name}"
              inst.save(raw_path)
              subset_main([
                  raw_path,
                  f"--unicodes={unicodes}",
                  f"--output-file={out_path}",
                  "--layout-features=*",
              ])
              print(name, os.path.getsize(out_path), "bytes")
          PYEOF

          mkdir -p /tmp/backup
          cp -r lib assets pubspec.yaml analysis_options.yaml /tmp/backup/
          flutter create --platforms=android --org com.modemzaid --project-name modem_zaid .
          rm -rf lib test
          cp -r /tmp/backup/lib .
          cp -r /tmp/backup/assets .
          cp /tmp/backup/pubspec.yaml .
          cp /tmp/backup/analysis_options.yaml .

          python3 - << 'PYEOF'
          import glob, os, re, shutil
          from PIL import Image

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              xml = f.read()

          perms = (
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              '    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n'
              '    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>\n'
          )
          if "android.permission.INTERNET" not in xml:
              xml = xml.replace("<application", perms + "    <application", 1)

          xml = re.sub(r'android:label="[^"]*"', 'android:label="مودم زيد"', xml)
          if "usesCleartextTraffic" not in xml:
              xml = xml.replace(
                  "<application",
                  '<application\n        android:usesCleartextTraffic="true"',
                  1,
              )

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(xml)

          for gf in glob.glob("android/app/build.gradle*"):
              with open(gf, "a", encoding="utf-8") as f:
                  f.write("\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n")
              print("Enabled compressed JNI packaging in", gf)

          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          with open("android_overrides/MainActivity.kt", "r", encoding="utf-8") as f:
              template = f.read()
          for kt in kt_files:
              with open(kt, "r", encoding="utf-8") as f:
                  code = f.read()
              m = re.search(r"^package\s+([\w\.]+)", code, re.M)
              pkg = m.group(1) if m else "com.modemzaid.modem_zaid"
              new_code = re.sub(r"^package\s+[\w\.]+", "package " + pkg, template, count=1, flags=re.M)
              with open(kt, "w", encoding="utf-8") as f:
                  f.write(new_code)
              print("Installed native Wi-Fi channel MainActivity in", kt, "package", pkg)

          src_icon = Image.open("assets/icon/app_icon.png").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          res_dir = "android/app/src/main/res"
          shutil.rmtree(os.path.join(res_dir, "mipmap-anydpi-v26"), ignore_errors=True)
          for folder, px in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              src_icon.resize((px, px), Image.Resampling.LANCZOS).save(
                  os.path.join(out_dir, "ic_launcher.png"), optimize=True
              )
          PYEOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Ultra-Slim Split-ABI Release APKs
        run: |
          flutter build apk --release --split-per-abi --tree-shake-icons --obfuscate --split-debug-info=/tmp/symbols
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ModemZaid-arm64-v1.5.0.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ModemZaid-arm32-v1.5.0.apk
          ls -lh ModemZaid-arm*.apk

      - name: Publish Slim APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: "مودم زيد v1.5.0 — إصلاح فوري للدخول السريع ودعم شامل لجميع مودمات يمن فورجي وسبيد فورجي"
          body: |
            إصدار **مودم زيد v1.5.0 (Modem Zaid)**:
            - **إصلاح جذري وسريع للدخول والربط**: فصل دقيق 100% بين مودم الجيب `MIFI-L818A` (`192.168.43.1` - `Notion Duster`) ومودم المؤسسة المنزلي `Yemen 4G CPE` (`192.168.0.1` - `Marvell UAPXC`)، وتسريع قراءة مقابس الشبكة لتقليص زمن الدخول من 15 ثانية إلى ~1.5 ثانية فقط.
            - **تبديل فوري بين المودمات (حتى في وضع الطيران + واي فاي)**: إعادة فحص وتحديث ربط الواي فاي تلقائياً عند الانتقال بين أي مودمين بدون الحاجة لإغلاق التطبيق.
            - **دعم موسع وشامل لجميع المودمات المنتشرة في اليمن** (المؤسسة العامة للاتصالات، `Star Speed 4G`، `Olax`، `ZLT`، `ZTE`، `Huawei`، `SAM`، `Vortex`، `Cool 4G`، `Jetpack`، `WeGo`، `Falcon`) مع نافذة **المودمات المدعومة**.
          files: |
            ModemZaid-arm64-v1.5.0.apk
            ModemZaid-arm32-v1.5.0.apk
          make_latest: true
