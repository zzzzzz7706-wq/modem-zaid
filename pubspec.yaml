name: modem_zaid
description: تطبيق ذكي وموحد لإدارة وترجمة واجهات ومميزات جميع مودمات يمن فورجي والراوترات تلقائياً.
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  crypto: ^3.0.3
  xml: ^6.5.0
  shared_preferences: ^2.2.3
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
